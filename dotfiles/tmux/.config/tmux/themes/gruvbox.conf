# gruvbox (dark, medium contrast) - palette matches ellisonleao/gruvbox.nvim

set -g status-style "bg=#3c3836,fg=#ebdbb2"

set -g window-status-current-style "bg=#fabd2f,fg=#1d2021,bold"
set -g window-status-style "bg=#3c3836,fg=#928374"

set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#fabd2f"

set -g message-style "bg=#fabd2f,fg=#1d2021"
set -g message-command-style "bg=#fabd2f,fg=#1d2021"

set -g mode-style "bg=#fabd2f,fg=#1d2021"

set -g clock-mode-colour "#fabd2f"
