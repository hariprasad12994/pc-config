# true color passthrough - without this tmux downconverts 24-bit colors
# (e.g. nvim colorschemes) to the 256-color palette, and background color
# changes in particular can silently fail to apply, leaving the terminal's
# raw default background showing through instead of the theme's bg
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# remap the prefix key from C-b to C-p
unbind C-b
set-option -g prefix C-p
bind-key C-p send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# reload the configuration file
bind r source-file ~/.config/tmux/tmux.conf

# enable mouse control
set -g mouse on

# dont allow auto rename of the window
# set-option -g allow-rename off

# switch panes with alt key
bind -n M-j select-pane -L
bind -n M-l select-pane -R
bind -n M-i select-pane -U
bind -n M-k select-pane -D

bind -r j resize-pane -U 5
bind -r k resize-pane -D 5
bind -r h resize-pane -R 5
bind -r l resize-pane -L 5
bind -r resize-pane -Z

# set vim keybinding 
set-window-option -g mode-keys vi
# enable vim like buffer copy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# agent alerts - a Claude Code pane blocked on input flags its window with ●,
# a finished turn with ○. Both colors come from the active theme. State is
# written by scripts/agent-flag.sh, driven by hooks in ~/.claude/settings.json.
set -g window-status-format " #{?#{==:#{@agent_win_state},wait},#[fg=#{@color_urgent}]●#[default] ,#{?#{==:#{@agent_win_state},done},#[fg=#{@color_ok}]○#[default] ,}}#I:#W#{?window_flags,#{window_flags},} "
set -g window-status-current-format " #{?#{==:#{@agent_win_state},wait},#[fg=#{@color_urgent}]●#[default] ,#{?#{==:#{@agent_win_state},done},#[fg=#{@color_ok}]○#[default] ,}}#I:#W#{?window_flags,#{window_flags},} "

# how many agents are blocked right now, across every window - the per-window
# glyphs cannot aggregate, so without this there is no "am I done" indicator
set -g status-right "#{?@agent_wait_count,#[fg=#{@color_urgent}]#{@agent_wait_count} waiting#[default]  ,}%H:%M %d-%b-%y"
set -g status-right-length 40

bind a run-shell "~/.config/tmux/scripts/agent-jump.sh next"
bind A run-shell "~/.config/tmux/scripts/agent-jump.sh menu"

# workspace templates - prefix + N picks a template, then a project directory.
# WS_EDITOR / WS_AGENT / WS_SHELL override these per invocation.
set -g @ws_editor "nvim"
set -g @ws_agent "claude"
set -g @ws_shell ""
set -g @ws_root "$HOME/code"

bind N display-menu -T " new workspace " -x C -y C \
    "agent   editor | claude" a "display-popup -w 60% -h 60% -E '~/.config/tmux/scripts/tmux-workspace.sh --pick agent'" \
    "code    editor / shell"  c "display-popup -w 60% -h 60% -E '~/.config/tmux/scripts/tmux-workspace.sh --pick code'" \
    "tui     editor | shell"  t "display-popup -w 60% -h 60% -E '~/.config/tmux/scripts/tmux-workspace.sh --pick tui'" \
    "single  editor"          s "display-popup -w 60% -h 60% -E '~/.config/tmux/scripts/tmux-workspace.sh --pick single'"

# theme - tokyonight (default) / gruvbox, matching the nvim colorschemes;
# prefix + T toggles between them and remembers the choice
run-shell "~/.config/tmux/scripts/tmux-theme.sh apply"
bind T run-shell "~/.config/tmux/scripts/tmux-theme.sh toggle"
